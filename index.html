<!DOCTYPE html>
<html>
<head>
  <title>For Shreeya ❤️</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      position: relative;
      width: 90%;
      max-width: 400px;
      height: 500px;
    }

    .card {
      position: absolute;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(15px);
      background: rgba(255,255,255,0.2);
      border-radius: 25px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      font-size: 24px;
      color: white;
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.7s ease;
    }

    .active {
      opacity: 1;
      transform: scale(1);
    }

    .heart {
      position: absolute;
      font-size: 20px;
      animation: float 6s linear infinite;
      color: white;
    }

    @keyframes float {
      0% { transform: translateY(100vh); opacity: 1; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }

    .tap {
      position: absolute;
      bottom: 15px;
      font-size: 12px;
      opacity: 0.7;
    }

  </style>
</head>

<body onclick="next()">

<div class="container">

  <div class="card active">Hey Shreeya ❤️<br><br><small>Tap to continue</small></div>
  <div class="card">Tum kitni cute ho pata hai? 😏</div>
  <div class="card">120% Over Cute 😍</div>
  <div class="card">Aur main idiot… galti kar di 😔</div>
  <div class="card">I'm really sorry ❤️</div>
  <div class="card">Bas ek chance de do… prove karunga 🥺</div>
  <div class="card">Please forgive me 🙂❤️</div>

</div>

<script>
let cards = document.querySelectorAll(".card");
let i = 0;

function next() {
  if (i < cards.length - 1) {
    cards[i].classList.remove("active");
    i++;
    cards[i].classList.add("active");
  }
}

setInterval(() => {
  let heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 20 + 10) + "px";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 6000);
}, 300);
</script>

</body>
</html>
