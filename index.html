      <!DOCTYPE html>
<html>
<head>
  <title>For Shreeya ❤️</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      background: black;
      color: white;
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 28px;
      padding: 20px;
      opacity: 0;
      transform: scale(1.2);
      transition: all 0.8s ease;
    }

    .active {
      opacity: 1;
      transform: scale(1);
    }

    .slide:nth-child(1) { background: linear-gradient(#ff758c, #ff7eb3); }
    .slide:nth-child(2) { background: linear-gradient(#ff9a9e, #fad0c4); }
    .slide:nth-child(3) { background: linear-gradient(#fbc2eb, #a6c1ee); }
    .slide:nth-child(4) { background: linear-gradient(#ffecd2, #fcb69f); }
    .slide:nth-child(5) { background: linear-gradient(#ff9a9e, #fecfef); }
    .slide:nth-child(6) { background: linear-gradient(#a18cd1, #fbc2eb); }

    .heart {
      position: absolute;
      font-size: 20px;
      animation: float 5s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(100vh); opacity: 1; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }

  </style>
</head>

<body onclick="nextSlide()">

<div class="slide active">Hey Shreeya ❤️</div>
<div class="slide">Tum kitni cute ho pata hai? 😏</div>
<div class="slide">120% Over Cute 😍</div>
<div class="slide">But maine galti kar di... 😔</div>
<div class="slide">I'm really sorry ❤️</div>
<div class="slide">Bas ek chance de do... please 🥺</div>

<script>
let slides = document.querySelectorAll(".slide");
let index = 0;

function nextSlide() {
  slides[index].classList.remove("active");
  index++;

  if (index < slides.length) {
    slides[index].classList.add("active");
  }
}

setInterval(() => {
  let heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 20 + 10) + "px";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 5000);
}, 300);
</script>

</body>
</html>
