<!DOCTYPE html>
<html>
<head>
  <title>For Shreeya ❤️</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h2 {
      color: #e91e63;
      min-height: 60px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #e91e63;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .heart {
      font-size: 30px;
      animation: beat 1s infinite;
    }

    @keyframes beat {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .buttons {
      display: none;
      margin-top: 20px;
    }

    .yes {
      background: green;
    }

    .no {
      background: red;
      position: relative;
    }
  </style>
</head>

<body>

<div class="card">
  <div class="heart">❤️</div>
  <h2 id="text"></h2>
  <button onclick="nextStep()" id="btn">Start</button>

  <div class="buttons" id="finalButtons">
    <button class="yes" onclick="yesClick()">YES 😊</button>
    <button class="no" onmouseover="moveNo()">NO 😏</button>
  </div>
</div>

<script>
const messages = [
  "Tum kitni cute ho? 😏",
  "120% Over Cute 😍",
  "Aur main idiot... jo galti kar di 😔",
  "I'm really sorry Shreeya ❤️",
  "Bas ek chance de do... prove karunga 😞",
  "Please forgive me 🙂❤️"
];

let index = 0;
let typingSpeed = 40;

function typeText(text, i = 0) {
  if (i < text.length) {
    document.getElementById("text").innerHTML += text.charAt(i);
    setTimeout(() => typeText(text, i + 1), typingSpeed);
  }
}

function nextStep() {
  const textBox = document.getElementById("text");
  textBox.innerHTML = "";

  if (index < messages.length) {
    typeText(messages[index]);
    index++;
  } else {
    document.getElementById("btn").style.display = "none";
    document.getElementById("finalButtons").style.display = "block";
    typeText("Ab to maan jao na 😏❤️");
  }
}

function moveNo() {
  const btn = document.querySelector(".no");
  btn.style.position = "absolute";
  btn.style.top = Math.random() * 200 + "px";
  btn.style.left = Math.random() * 200 + "px";
}

function yesClick() {
  document.getElementById("text").innerHTML = "Yayyy 😍❤️ I promise I’ll be better!";
  document.getElementById("finalButtons").style.display = "none";
}
</script>

</body>
</html>
