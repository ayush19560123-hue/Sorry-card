<!DOCTYPE html>
<html>
<head>
  <title>For Shreeya 💖</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
      font-family: Arial;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 320px;
      height: 450px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }

    .container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(70%);
      animation: zoom 6s infinite alternate;
    }

    @keyframes zoom {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }

    .text {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 22px;
      font-weight: bold;
    }

    .heart {
      position: absolute;
      color: red;
      animation: float 4s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-500px); opacity: 0; }
    }
  </style>
</head>

<body>

<div class="container">
  <!-- ✅ TERA ORIGINAL IMAGE NAME -->
  <img src="IMG_20260328_010529.jpg">

  <div class="text" id="text"></div>
</div>

<script>
  const lines = [
    "Shreeya...",
    "mujhse galti ho gayi...",
    "pls ek chance dedo 💖"
  ];

  let i = 0, j = 0;

  function typeEffect() {
    if (i < lines.length) {
      let current = lines[i];
      if (j < current.length) {
        document.getElementById("text").innerHTML += current[j];
        j++;
        setTimeout(typeEffect, 60);
      } else {
        document.getElementById("text").innerHTML += "<br>";
        i++; j = 0;
        setTimeout(typeEffect, 800);
      }
    }
  }

  typeEffect();

  // 💖 hearts animation
  setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 4000);
  }, 300);
</script>

</body>
</html>
